name: Formal proxy isolated diagnostic

on:
  push:
    branches: ['codex/sayweave-release-0113-host-v01']

# Acceptance-only: no signing secrets, release writes or installed owner state.
permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    if: github.repository == 'qinghui316/Sayweave'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Preserve acceptance probe and select exact product
        shell: pwsh
        run: |
          Copy-Item -LiteralPath src-tauri/text-service/src/formal_switch_probe.rs -Destination "$env:RUNNER_TEMP/formal_switch_probe.rs"
          git checkout --detach f36591ae238944c994feb246ce83271c940c4c59
          if ($LASTEXITCODE -ne 0) { throw 'Product missing' }
          if ((git rev-parse v0.1.13).Trim() -ne 'f36591ae238944c994feb246ce83271c940c4c59') { throw 'Product tag differs' }
          rustup show
          if ($LASTEXITCODE -ne 0) { throw 'Pinned toolchain unavailable' }
      - name: Build exact ordinary core before acceptance overlay
        shell: pwsh
        run: |
          cargo build --locked --release --manifest-path src-tauri/text-service/Cargo.toml --lib --features engine
          if ($LASTEXITCODE -ne 0) { throw 'Core build failed' }
          "SAYWEAVE_TSF_PAYLOAD=$env:GITHUB_WORKSPACE/src-tauri/text-service/target/release/sayweave_text_service.dll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-verifier-v0.1.13-f36591ae238944c994feb246ce83271c940c4c59
          run-id: 38613768212
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-verifier
      - name: Verify retained tool and run existing isolated gate
        shell: pwsh
        run: |
          $env:SAYWEAVE_VERIFIER_DIR = "$env:RUNNER_TEMP/release-verifier"
          $tool = Join-Path $env:SAYWEAVE_VERIFIER_DIR 'verify-update-signature.exe'
          if ((Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a4491230769b333e7b19709684c912349e88d78bd482e0afc458b16d8d2c1aa0') { throw 'Retained verifier differs' }
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/formal_switch_probe.rs" -Destination src-tauri/text-service/src/formal_switch_probe.rs
          node scripts/test-formal-core-switch.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic native gate failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: formal-proxy-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .local/formal-core-switch/*.log
            .local/formal-core-switch/receipt.json
          if-no-files-found: warn
