name: Sayweave Windows release

on:
  push:
    tags:
      - 'v*'
      - '!v*-release-check-*'
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [build, build-frozen, resume-package, check-access, accept-existing]
        default: build
        description: Build a release or resume the exact immutable draft
      release_tag:
        type: string
        default: ''
        description: Exact frozen product tag
      release_commit:
        type: string
        default: ''
        description: Exact frozen product commit, independent of this workflow revision
      release_id:
        type: string
        default: ''
        description: Existing GitHub Release ID
      checksum_sha256:
        type: string
        default: ''
        description: Frozen SHA256SUMS.txt hash covering all five draft assets
      verification_run_id:
        type: string
        default: ''
        description: Successful exact-product verify job to reuse for a frozen build
      package_run_id:
        type: string
        default: ''
        description: Exact retained signed package and verifier producer for resume-package

permissions:
  contents: read
  actions: read

concurrency:
  group: sayweave-windows-release
  cancel-in-progress: false

env:
  SAYWEAVE_RELEASE_TAG: ${{ (inputs.phase == 'build-frozen' || inputs.phase == 'resume-package' || inputs.phase == 'check-access' || inputs.phase == 'accept-existing') && inputs.release_tag || github.ref_name }}
  SAYWEAVE_RELEASE_COMMIT: ${{ (inputs.phase == 'build-frozen' || inputs.phase == 'resume-package' || inputs.phase == 'check-access' || inputs.phase == 'accept-existing') && inputs.release_commit || github.sha }}
  SAYWEAVE_CONTROLLER_COMMIT: ${{ github.sha }}
  SAYWEAVE_CONTROLLER_REF: ${{ github.ref }}
  SAYWEAVE_RELEASE_PHASE: ${{ inputs.phase || 'build' }}
  SAYWEAVE_PACKAGE_RUN: ${{ inputs.package_run_id }}

jobs:
  verify:
    if: github.repository == 'qinghui316/Sayweave'
    runs-on: windows-latest
    steps:
      - name: Validate existing-draft inputs
        shell: pwsh
        env:
          EXPECTED_RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_CHECKSUM: ${{ inputs.checksum_sha256 }}
          VERIFICATION_RUN: ${{ inputs.verification_run_id }}
          PACKAGE_RUN: ${{ inputs.package_run_id }}
        run: |
          if ($env:SAYWEAVE_RELEASE_PHASE -notin @('build','build-frozen','resume-package','check-access','accept-existing')) { throw 'Unknown release phase.' }
          if ($env:SAYWEAVE_RELEASE_PHASE -eq 'build-frozen' -and ($env:SAYWEAVE_RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$' -or $env:SAYWEAVE_RELEASE_COMMIT -notmatch '^[a-f0-9]{40}$' -or $env:SAYWEAVE_CONTROLLER_REF -notmatch "^refs/tags/$([regex]::Escape($env:SAYWEAVE_RELEASE_TAG))-release-check-[a-z0-9][a-z0-9.-]*$" -or $env:EXPECTED_RELEASE_ID -notmatch '^[1-9]\d*$' -or $env:EXPECTED_CHECKSUM)) { throw 'Exact frozen product, empty owner draft and diagnostic controller identities are required.' }
          if ($env:VERIFICATION_RUN -and ($env:SAYWEAVE_RELEASE_PHASE -notin @('build-frozen','resume-package') -or $env:VERIFICATION_RUN -notmatch '^[1-9]\d*$')) { throw 'Verification reuse is restricted to an exact frozen build.' }
          if ($env:SAYWEAVE_RELEASE_PHASE -in @('check-access','accept-existing') -and ($env:SAYWEAVE_RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$' -or $env:SAYWEAVE_RELEASE_COMMIT -notmatch '^[a-f0-9]{40}$' -or $env:EXPECTED_RELEASE_ID -notmatch '^[1-9]\d*$' -or $env:EXPECTED_CHECKSUM -notmatch '^[a-f0-9]{64}$')) { throw 'Exact existing-draft identities are required.' }
          if ($env:SAYWEAVE_RELEASE_PHASE -eq 'resume-package' -and ($env:SAYWEAVE_RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$' -or $env:SAYWEAVE_RELEASE_COMMIT -notmatch '^[a-f0-9]{40}$' -or $env:SAYWEAVE_CONTROLLER_REF -notmatch "^refs/tags/$([regex]::Escape($env:SAYWEAVE_RELEASE_TAG))-release-check-[a-z0-9][a-z0-9.-]*$" -or $env:EXPECTED_RELEASE_ID -notmatch '^[1-9]\d*$' -or $env:EXPECTED_CHECKSUM -notmatch '^[a-f0-9]{64}$' -or $env:PACKAGE_RUN -notmatch '^[1-9]\d*$' -or $env:VERIFICATION_RUN -notmatch '^[1-9]\d*$')) { throw 'Exact retained package/tool and verification identities required.' }
          if ($env:SAYWEAVE_RELEASE_PHASE -in @('check-access','accept-existing') -and $env:PACKAGE_RUN -notmatch '^[1-9]\d*$') { throw 'Existing assets require their retained full verifier producer.' }
          if ($env:SAYWEAVE_RELEASE_PHASE -notin @('resume-package','check-access','accept-existing') -and $env:PACKAGE_RUN) { throw 'Build cannot substitute a retained package producer.' }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ (inputs.phase == 'build-frozen' || inputs.phase == 'resume-package' || inputs.phase == 'check-access' || inputs.phase == 'accept-existing') && inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - if: inputs.verification_run_id == '' && inputs.phase != 'resume-package' && inputs.phase != 'check-access' && inputs.phase != 'accept-existing'
        run: npm ci
      - name: Load reviewed release controller
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'sayweave-controller'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          foreach ($name in @('release-validation.mjs','verify-update-release.mjs')) {
            $source = git show "$($env:SAYWEAVE_CONTROLLER_COMMIT):scripts/$name"
            if ($LASTEXITCODE -ne 0) { throw 'Reviewed release controller missing.' }
            $source | Set-Content -LiteralPath (Join-Path $directory $name) -Encoding utf8
          }
          "SAYWEAVE_RELEASE_HELPER=$(Join-Path $directory 'release-validation.mjs')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SAYWEAVE_VERIFIER_HELPER=$(Join-Path $directory 'verify-update-release.mjs')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SAYWEAVE_VERIFIER_DIR=$(Join-Path $env:RUNNER_TEMP 'release-verifier')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify frozen product and landed controller
        if: inputs.phase == 'build-frozen' || inputs.phase == 'resume-package' || inputs.phase == 'check-access' || inputs.phase == 'accept-existing'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:SAYWEAVE_RELEASE_COMMIT) { throw 'Product commit differs from the selected tag.' }
          if ($env:SAYWEAVE_RELEASE_TAG -ne "v$(node -p "require('./package.json').version")") { throw 'Product version differs.' }
          git merge-base --is-ancestor $env:SAYWEAVE_RELEASE_COMMIT origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Product is not on main.' }
          if ($env:SAYWEAVE_RELEASE_PHASE -in @('build-frozen','resume-package','accept-existing')) {
            if ($env:SAYWEAVE_CONTROLLER_REF -notlike 'refs/tags/v*-release-check-*') { throw 'Frozen continuation requires a reviewed controller tag.' }
            git merge-base --is-ancestor $env:SAYWEAVE_CONTROLLER_COMMIT origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Controller is not landed on main.' }
          }
          if ($env:SAYWEAVE_RELEASE_PHASE -eq 'accept-existing') {
            node scripts/reuse-windows-update-evidence.mjs .local/release-mechanism-evidence
            if ($LASTEXITCODE -ne 0) { throw 'Exact existing-installation evidence is required.' }
          }
      - name: Reuse passed exact-product checks with unchanged reviewed tests
        if: inputs.verification_run_id != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SAYWEAVE_VERIFICATION_RUN: ${{ inputs.verification_run_id }}
        run: |
          $helper = Join-Path $env:RUNNER_TEMP 'reuse-release-verification.mjs'
          $source = git show "$($env:SAYWEAVE_CONTROLLER_COMMIT):scripts/release-validation.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed verifier missing.' }
          $source | Set-Content -LiteralPath $helper -Encoding utf8
          node $helper reuse-verification
          if ($LASTEXITCODE -ne 0) { throw 'Existing exact-product evidence is invalid.' }
      - name: Calculate Cargo compatibility and exact source keys
        if: inputs.verification_run_id == '' && inputs.phase != 'resume-package' && inputs.phase != 'check-access' && inputs.phase != 'accept-existing'
        id: cargo-keys
        shell: pwsh
        run: |
          node $env:SAYWEAVE_RELEASE_HELPER cargo-cache
          if ($LASTEXITCODE -ne 0) { throw 'Cargo cache context incomplete.' }
      - name: Restore public Cargo dependencies
        if: inputs.verification_run_id == '' && inputs.phase != 'resume-package' && inputs.phase != 'check-access' && inputs.phase != 'accept-existing'
        id: cargo-registry
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.cargo-keys.outputs.registryKey }}
          restore-keys: ${{ steps.cargo-keys.outputs.registryPrefix }}
          path: |
            ~/.cargo/registry/index/index.crates.io-*
            ~/.cargo/registry/cache/index.crates.io-*
            ~/.cargo/registry/src/index.crates.io-*
      - name: Restore compatible main and component compiler caches
        if: inputs.verification_run_id == '' && inputs.phase != 'resume-package' && inputs.phase != 'check-access' && inputs.phase != 'accept-existing'
        id: cargo-compiled
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.cargo-keys.outputs.compileKey }}
          restore-keys: ${{ steps.cargo-keys.outputs.compilePrefix }}
          path: |
            src-tauri/target/debug/deps
            src-tauri/target/debug/build
            src-tauri/target/debug/.fingerprint
            src-tauri/target/debug/incremental
            src-tauri/target/release/deps
            src-tauri/target/release/build
            src-tauri/target/release/.fingerprint
            src-tauri/target/release/incremental
            src-tauri/text-service/target/debug/deps
            src-tauri/text-service/target/debug/build
            src-tauri/text-service/target/debug/.fingerprint
            src-tauri/text-service/target/debug/incremental
            src-tauri/text-service/target/release/deps
            src-tauri/text-service/target/release/build
            src-tauri/text-service/target/release/.fingerprint
            src-tauri/text-service/target/release/incremental
      - name: Record Cargo restore results
        if: inputs.verification_run_id == '' && inputs.phase != 'resume-package' && inputs.phase != 'check-access' && inputs.phase != 'accept-existing'
        shell: pwsh
        run: Write-Output 'Cargo registry exact=${{ steps.cargo-registry.outputs.cache-hit }} compiler exact=${{ steps.cargo-compiled.outputs.cache-hit }}; restored key=${{ steps.cargo-compiled.outputs.cache-matched-key }}'
      - if: inputs.verification_run_id == '' && inputs.phase != 'resume-package' && inputs.phase != 'check-access' && inputs.phase != 'accept-existing'
        run: npx playwright install chromium
      - if: inputs.verification_run_id == '' && inputs.phase != 'resume-package' && inputs.phase != 'check-access' && inputs.phase != 'accept-existing'
        run: npm run check
      - if: inputs.verification_run_id == '' && inputs.phase != 'build-frozen' && inputs.phase != 'resume-package' && inputs.phase != 'check-access' && inputs.phase != 'accept-existing'
        run: npm run test:e2e
      - name: Run reviewed E2E against the frozen product and restore its checkout
        if: inputs.verification_run_id == '' && inputs.phase == 'build-frozen'
        shell: pwsh
        run: |
          $helper = Join-Path $env:RUNNER_TEMP 'prepare-frozen-release.mjs'
          $source = git show "$($env:SAYWEAVE_CONTROLLER_COMMIT):scripts/release-validation.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed controller helper missing.' }
          $source | Set-Content -LiteralPath $helper -Encoding utf8
          node $helper
          if ($LASTEXITCODE -ne 0) { throw 'Frozen product E2E verification failed.' }
      - if: inputs.verification_run_id == '' && inputs.phase != 'resume-package' && inputs.phase != 'check-access' && inputs.phase != 'accept-existing'
        run: npm run check:distribution

      - name: Save public Cargo dependencies
        if: always() && (inputs.verification_run_id == '' && inputs.phase != 'resume-package' && inputs.phase != 'check-access' && inputs.phase != 'accept-existing') && steps.cargo-keys.outcome == 'success' && steps.cargo-registry.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.cargo-keys.outputs.registryKey }}
          path: |
            ~/.cargo/registry/index/index.crates.io-*
            ~/.cargo/registry/cache/index.crates.io-*
            ~/.cargo/registry/src/index.crates.io-*
      - name: Save main and component hot compiler caches
        if: always() && (inputs.verification_run_id == '' && inputs.phase != 'resume-package' && inputs.phase != 'check-access' && inputs.phase != 'accept-existing') && steps.cargo-keys.outcome == 'success' && steps.cargo-compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.cargo-keys.outputs.compileKey }}
          path: |
            src-tauri/target/debug/deps
            src-tauri/target/debug/build
            src-tauri/target/debug/.fingerprint
            src-tauri/target/debug/incremental
            src-tauri/target/release/deps
            src-tauri/target/release/build
            src-tauri/target/release/.fingerprint
            src-tauri/target/release/incremental
            src-tauri/text-service/target/debug/deps
            src-tauri/text-service/target/debug/build
            src-tauri/text-service/target/debug/.fingerprint
            src-tauri/text-service/target/debug/incremental
            src-tauri/text-service/target/release/deps
            src-tauri/text-service/target/release/build
            src-tauri/text-service/target/release/.fingerprint
            src-tauri/text-service/target/release/incremental

  draft:
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'qinghui316/Sayweave' && inputs.phase != 'check-access' && inputs.phase != 'accept-existing'
    needs: verify
    runs-on: windows-latest
    environment: windows-signing
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SAYWEAVE_BUILD_CHANNEL: stable
      EXPECTED_RELEASE_ID: ${{ inputs.release_id }}
      EXPECTED_CHECKSUM: ${{ inputs.checksum_sha256 }}
    outputs:
      release_id: ${{ steps.pin.outputs.release_id }}
      checksum: ${{ steps.pin.outputs.checksum }}
      package_run: ${{ steps.pin.outputs.package_run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Load reviewed release controller
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'sayweave-controller'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          foreach ($name in @('release-validation.mjs','verify-update-release.mjs')) {
            $source = git show "$($env:SAYWEAVE_CONTROLLER_COMMIT):scripts/$name"
            if ($LASTEXITCODE -ne 0) { throw 'Reviewed release controller missing.' }
            $source | Set-Content -LiteralPath (Join-Path $directory $name) -Encoding utf8
          }
          "SAYWEAVE_RELEASE_HELPER=$(Join-Path $directory 'release-validation.mjs')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SAYWEAVE_VERIFIER_HELPER=$(Join-Path $directory 'verify-update-release.mjs')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SAYWEAVE_VERIFIER_DIR=$(Join-Path $env:RUNNER_TEMP 'release-verifier')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Preflight owner permissions, draft and retained package before building
        id: owner
        shell: pwsh
        run: |
          node $env:SAYWEAVE_RELEASE_HELPER package-preflight
          if ($LASTEXITCODE -ne 0) { throw 'Owner draft/package preflight failed before build.' }
      - name: Bind preflight draft identity
        shell: pwsh
        run: '"EXPECTED_RELEASE_ID=${{ steps.owner.outputs.release_id }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - if: inputs.phase != 'resume-package'
        run: npm ci
      - name: Calculate Cargo compatibility and exact source keys
        if: inputs.phase != 'resume-package'
        id: cargo-keys
        shell: pwsh
        run: |
          node $env:SAYWEAVE_RELEASE_HELPER cargo-cache
          if ($LASTEXITCODE -ne 0) { throw 'Cargo cache context incomplete.' }
      - name: Restore public Cargo dependencies
        if: inputs.phase != 'resume-package'
        id: cargo-registry
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.cargo-keys.outputs.registryKey }}
          restore-keys: ${{ steps.cargo-keys.outputs.registryPrefix }}
          path: |
            ~/.cargo/registry/index/index.crates.io-*
            ~/.cargo/registry/cache/index.crates.io-*
            ~/.cargo/registry/src/index.crates.io-*
      - name: Restore compatible main and component compiler caches
        if: inputs.phase != 'resume-package'
        id: cargo-compiled
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.cargo-keys.outputs.compileKey }}
          restore-keys: ${{ steps.cargo-keys.outputs.compilePrefix }}
          path: |
            src-tauri/target/debug/deps
            src-tauri/target/debug/build
            src-tauri/target/debug/.fingerprint
            src-tauri/target/debug/incremental
            src-tauri/target/release/deps
            src-tauri/target/release/build
            src-tauri/target/release/.fingerprint
            src-tauri/target/release/incremental
            src-tauri/text-service/target/debug/deps
            src-tauri/text-service/target/debug/build
            src-tauri/text-service/target/debug/.fingerprint
            src-tauri/text-service/target/debug/incremental
            src-tauri/text-service/target/release/deps
            src-tauri/text-service/target/release/build
            src-tauri/text-service/target/release/.fingerprint
            src-tauri/text-service/target/release/incremental
      - name: Record Cargo restore results
        if: inputs.phase != 'resume-package'
        shell: pwsh
        run: Write-Output 'Cargo registry exact=${{ steps.cargo-registry.outputs.cache-hit }} compiler exact=${{ steps.cargo-compiled.outputs.cache-hit }}; restored key=${{ steps.cargo-compiled.outputs.cache-matched-key }}'
      - name: Build ordinary component with locked dependencies
        if: inputs.phase != 'resume-package'
        shell: pwsh
        run: |
          cargo metadata --locked --no-deps --manifest-path src-tauri/Cargo.toml > $null
          if ($LASTEXITCODE -ne 0) { throw 'Application lock differs.' }
          cargo build --locked --release --manifest-path src-tauri/text-service/Cargo.toml --lib
          if ($LASTEXITCODE -ne 0) { throw 'Ordinary component build failed.' }
          "SAYWEAVE_TSF_PAYLOAD=$(Join-Path $env:GITHUB_WORKSPACE 'src-tauri/text-service/target/release/sayweave_text_service.dll')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build signed NSIS package
        id: signed
        if: inputs.phase != 'resume-package'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # The frozen packaging entry appends its Tauri resource --config.
          # Do not insert Cargo's trailing -- before that product-owned option.
          npm run desktop:package
          if ($LASTEXITCODE -ne 0) { throw 'Signed package build failed.' }
          npm run desktop:release:manifest
          if ($LASTEXITCODE -ne 0) { throw 'Manifest generation failed.' }
          Write-Output 'Package builds in this run: 1. These exact bytes must survive every later API failure.'
      - name: Preserve signed release bytes before Release operations
        if: always() && steps.signed.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-package-${{ env.SAYWEAVE_RELEASE_TAG }}-${{ env.SAYWEAVE_RELEASE_COMMIT }}
          retention-days: 14
          path: release/sayweave/*
          if-no-files-found: error
      - name: Preserve failed bundle diagnostics
        if: always() && steps.signed.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-build-failure-${{ env.SAYWEAVE_RELEASE_TAG }}-${{ env.SAYWEAVE_RELEASE_COMMIT }}
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: warn
      - name: Build full signature verifier once
        if: inputs.phase != 'resume-package'
        shell: pwsh
        run: |
          node $env:SAYWEAVE_VERIFIER_HELPER build-tool
          if ($LASTEXITCODE -ne 0) { throw 'Full verifier build failed; signed package is already retained.' }
      - name: Preserve full signature verifier
        if: inputs.phase != 'resume-package'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-verifier-${{ env.SAYWEAVE_RELEASE_TAG }}-${{ env.SAYWEAVE_RELEASE_COMMIT }}
          retention-days: 14
          path: ${{ runner.temp }}/release-verifier/*
          if-no-files-found: error
      - name: Download exact retained signed package
        if: inputs.phase == 'resume-package'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-package-${{ env.SAYWEAVE_RELEASE_TAG }}-${{ env.SAYWEAVE_RELEASE_COMMIT }}
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ github.token }}
          path: release/sayweave
      - name: Download retained full signature verifier
        if: inputs.phase == 'resume-package'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-verifier-${{ env.SAYWEAVE_RELEASE_TAG }}-${{ env.SAYWEAVE_RELEASE_COMMIT }}
          run-id: ${{ inputs.package_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-verifier
      - name: Verify retained package with recorded full verifier
        shell: pwsh
        run: |
          node $env:SAYWEAVE_VERIFIER_HELPER
          if ($LASTEXITCODE -ne 0) { throw 'Native signature/tool identity verification failed.' }
      - name: Upload missing exact assets and freeze draft identity
        id: pin
        shell: pwsh
        run: |
          node $env:SAYWEAVE_RELEASE_HELPER upload-package
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload failed; resume the retained package without rebuilding.' }
      - name: Re-download and fully verify uploaded draft
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'sayweave-release'
          New-Item -ItemType Directory -Force -Path $download | Out-Null
          gh release download $env:SAYWEAVE_RELEASE_TAG --repo '${{ github.repository }}' --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Draft download failed; retained package remains available.' }
          if ((Get-FileHash -LiteralPath (Join-Path $download 'SHA256SUMS.txt') -Algorithm SHA256).Hash.ToLowerInvariant() -ne '${{ steps.pin.outputs.checksum }}') { throw 'Uploaded draft changed after its identity was frozen.' }
          $env:SAYWEAVE_RELEASE_DIR = $download
          node $env:SAYWEAVE_VERIFIER_HELPER
          if ($LASTEXITCODE -ne 0) { throw 'Draft full signature verification failed.' }
      - name: Save public Cargo dependencies
        if: always() && steps.cargo-keys.outcome == 'success' && steps.cargo-registry.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.cargo-keys.outputs.registryKey }}
          path: |
            ~/.cargo/registry/index/index.crates.io-*
            ~/.cargo/registry/cache/index.crates.io-*
            ~/.cargo/registry/src/index.crates.io-*
      - name: Save main and component hot compiler caches
        if: always() && steps.cargo-keys.outcome == 'success' && steps.cargo-compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.cargo-keys.outputs.compileKey }}
          path: |
            src-tauri/target/debug/deps
            src-tauri/target/debug/build
            src-tauri/target/debug/.fingerprint
            src-tauri/target/debug/incremental
            src-tauri/target/release/deps
            src-tauri/target/release/build
            src-tauri/target/release/.fingerprint
            src-tauri/target/release/incremental
            src-tauri/text-service/target/debug/deps
            src-tauri/text-service/target/debug/build
            src-tauri/text-service/target/debug/.fingerprint
            src-tauri/text-service/target/debug/incremental
            src-tauri/text-service/target/release/deps
            src-tauri/text-service/target/release/build
            src-tauri/text-service/target/release/.fingerprint
            src-tauri/text-service/target/release/incremental

  accept-installer:
    if: always() && !cancelled() && github.repository == 'qinghui316/Sayweave' && needs.verify.result == 'success' && ((startsWith(github.ref, 'refs/tags/') && needs.draft.result == 'success') || (github.event_name == 'workflow_dispatch' && (inputs.phase == 'check-access' || inputs.phase == 'accept-existing') && needs.draft.result == 'skipped'))
    needs: [verify, draft]
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SAYWEAVE_BUILD_CHANNEL: stable
      EXPECTED_RELEASE_ID: ${{ (inputs.phase == 'check-access' || inputs.phase == 'accept-existing') && inputs.release_id || needs.draft.outputs.release_id }}
      EXPECTED_CHECKSUM: ${{ (inputs.phase == 'check-access' || inputs.phase == 'accept-existing') && inputs.checksum_sha256 || needs.draft.outputs.checksum }}
      SAYWEAVE_PACKAGE_RUN: ${{ inputs.package_run_id || needs.draft.outputs.package_run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Load reviewed release controller
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'sayweave-controller'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          foreach ($name in @('release-validation.mjs','verify-update-release.mjs')) {
            $source = git show "$($env:SAYWEAVE_CONTROLLER_COMMIT):scripts/$name"
            if ($LASTEXITCODE -ne 0) { throw 'Reviewed release controller missing.' }
            $source | Set-Content -LiteralPath (Join-Path $directory $name) -Encoding utf8
          }
          "SAYWEAVE_RELEASE_HELPER=$(Join-Path $directory 'release-validation.mjs')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SAYWEAVE_VERIFIER_HELPER=$(Join-Path $directory 'verify-update-release.mjs')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SAYWEAVE_VERIFIER_DIR=$(Join-Path $env:RUNNER_TEMP 'release-verifier')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Download retained full signature verifier
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-verifier-${{ env.SAYWEAVE_RELEASE_TAG }}-${{ env.SAYWEAVE_RELEASE_COMMIT }}
          run-id: ${{ inputs.package_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-verifier
      - if: inputs.phase == 'accept-existing'
        run: npm ci
      - name: Reuse evidence for explicitly requested existing-package installation
        if: inputs.phase == 'accept-existing'
        run: node scripts/reuse-windows-update-evidence.mjs .local/release-mechanism-evidence
      - name: Verify draft assets; install only in explicitly requested existing-package mode
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'sayweave-draft-acceptance'
          New-Item -ItemType Directory -Path $download | Out-Null
          New-Item -ItemType Directory -Force -Path .local | Out-Null
          $controller = @{ controllerCommit=$env:SAYWEAVE_CONTROLLER_COMMIT; productCommit=$env:SAYWEAVE_RELEASE_COMMIT; productTag=$env:SAYWEAVE_RELEASE_TAG; phase=$env:SAYWEAVE_RELEASE_PHASE; releaseId=$env:EXPECTED_RELEASE_ID; checksum=$env:EXPECTED_CHECKSUM; packageRun=$env:SAYWEAVE_PACKAGE_RUN }
          $controller | ConvertTo-Json | Set-Content -LiteralPath '.local/release-controller.json' -Encoding utf8
          $release = gh api "repos/qinghui316/Sayweave/releases/$env:EXPECTED_RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or [string]$release.id -ne $env:EXPECTED_RELEASE_ID -or $release.tag_name -ne $env:SAYWEAVE_RELEASE_TAG -or $release.draft -ne $true -or $release.target_commitish -ne $env:SAYWEAVE_RELEASE_COMMIT) { throw 'Frozen draft identity differs.' }
          gh release download $env:SAYWEAVE_RELEASE_TAG --repo '${{ github.repository }}' --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Draft download failed.' }
          if ((Get-FileHash -LiteralPath (Join-Path $download 'SHA256SUMS.txt') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:EXPECTED_CHECKSUM) { throw 'Frozen draft asset hashes differ.' }
          $env:SAYWEAVE_RELEASE_DIR = $download
          node $env:SAYWEAVE_VERIFIER_HELPER
          if ($LASTEXITCODE -ne 0) { throw 'Draft full signature verification failed.' }
          if ($env:SAYWEAVE_RELEASE_PHASE -eq 'check-access') {
            $controller | ConvertTo-Json | Set-Content -LiteralPath '.local/release-draft-access.json' -Encoding utf8
          } elseif ($env:SAYWEAVE_RELEASE_PHASE -eq 'accept-existing') {
            node scripts/test-windows-update.mjs --stable-installer (Join-Path $download "Sayweave_$(node -p "require('./package.json').version")_x64-setup.exe") --mechanism-evidence .local/release-mechanism-evidence
            if ($LASTEXITCODE -ne 0) { throw 'Explicit draft installation check failed.' }
          } else {
            Write-Output 'Same package and full verifier reused; actual installation/update remains owner trial. No Cargo build here.'
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stable-install-acceptance
          retention-days: 7
          include-hidden-files: true
          path: |
            .local/release-controller.json
            .local/release-draft-access.json
            .local/windows-update-acceptance.json
            .local/windows-update/*/acceptance.json
            .local/windows-update/*/native-*.png
            .local/windows-update/*/diagnostics/*.log
          if-no-files-found: warn
  publish:
    if: always() && !cancelled() && startsWith(github.ref, 'refs/tags/') && github.repository == 'qinghui316/Sayweave' && needs.accept-installer.result == 'success' && ((needs.draft.result == 'success' && inputs.phase != 'check-access') || (needs.draft.result == 'skipped' && inputs.phase == 'accept-existing'))
    needs: [draft, accept-installer]
    runs-on: windows-latest
    environment: windows-release
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SAYWEAVE_BUILD_CHANNEL: stable
      EXPECTED_RELEASE_ID: ${{ inputs.phase == 'accept-existing' && inputs.release_id || needs.draft.outputs.release_id }}
      EXPECTED_CHECKSUM: ${{ inputs.phase == 'accept-existing' && inputs.checksum_sha256 || needs.draft.outputs.checksum }}
      SAYWEAVE_PACKAGE_RUN: ${{ inputs.package_run_id || needs.draft.outputs.package_run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Load reviewed release controller
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'sayweave-controller'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          foreach ($name in @('release-validation.mjs','verify-update-release.mjs')) {
            $source = git show "$($env:SAYWEAVE_CONTROLLER_COMMIT):scripts/$name"
            if ($LASTEXITCODE -ne 0) { throw 'Reviewed release controller missing.' }
            $source | Set-Content -LiteralPath (Join-Path $directory $name) -Encoding utf8
          }
          "SAYWEAVE_RELEASE_HELPER=$(Join-Path $directory 'release-validation.mjs')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SAYWEAVE_VERIFIER_HELPER=$(Join-Path $directory 'verify-update-release.mjs')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SAYWEAVE_VERIFIER_DIR=$(Join-Path $env:RUNNER_TEMP 'release-verifier')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Download retained full signature verifier
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-verifier-${{ env.SAYWEAVE_RELEASE_TAG }}-${{ env.SAYWEAVE_RELEASE_COMMIT }}
          run-id: ${{ inputs.package_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-verifier
      - name: Re-download and verify approved draft with the same verifier
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'sayweave-approved-release'
          New-Item -ItemType Directory -Force -Path $download | Out-Null
          $release = gh api "repos/qinghui316/Sayweave/releases/$env:EXPECTED_RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or [string]$release.id -ne $env:EXPECTED_RELEASE_ID -or $release.tag_name -ne $env:SAYWEAVE_RELEASE_TAG -or $release.draft -ne $true -or $release.target_commitish -ne $env:SAYWEAVE_RELEASE_COMMIT) { throw 'Approved draft identity differs.' }
          gh release download $env:SAYWEAVE_RELEASE_TAG --repo '${{ github.repository }}' --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Approved draft download failed.' }
          if ((Get-FileHash -LiteralPath (Join-Path $download 'SHA256SUMS.txt') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:EXPECTED_CHECKSUM) { throw 'Approved asset hashes differ.' }
          $env:SAYWEAVE_RELEASE_DIR = $download
          node $env:SAYWEAVE_VERIFIER_HELPER
          if ($LASTEXITCODE -ne 0) { throw 'Approved draft full verification failed.' }
      - name: Publish latest release
        if: inputs.phase != 'accept-existing'
        shell: pwsh
        run: |
          gh release edit $env:SAYWEAVE_RELEASE_TAG --repo '${{ github.repository }}' --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed; keep the same retained package for resume-package.' }
      - name: Record protected publication eligibility for an older immutable tag
        if: inputs.phase == 'accept-existing'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .local | Out-Null
          @{controllerCommit=$env:SAYWEAVE_CONTROLLER_COMMIT;productCommit=$env:SAYWEAVE_RELEASE_COMMIT;productTag=$env:SAYWEAVE_RELEASE_TAG;releaseId=$env:EXPECTED_RELEASE_ID;checksum=$env:EXPECTED_CHECKSUM;actualInstall='success';protectedReview='approved';published=$false} | ConvertTo-Json | Set-Content -LiteralPath '.local/release-publication-ready.json' -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.phase == 'accept-existing'
        with:
          name: release-publication-ready
          retention-days: 14
          path: .local/release-publication-ready.json
          include-hidden-files: true
          if-no-files-found: error
