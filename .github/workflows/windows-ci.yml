name: Sayweave Windows validation
on:
  push:
    branches: [main, 'codex/sayweave-release-update-repair-v01']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Preserve installer diagnostics when a corrected candidate is pushed.
  # Only duplicate runs of this exact ref/commit supersede one another.
  group: windows-validation-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  ci:
    name: CI
    needs: windows-tooling
    if: always()
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Require successful short tooling proof
        if: needs.windows-tooling.result != 'success'
        run: throw 'Short Windows tooling proof failed; long validation is blocked.'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run check
      - run: npm run test:e2e
      - run: npm run test:desktop
      - run: npm run check:distribution
  windows-tooling:
    name: Windows update tooling
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/test-windows-update.mjs --tools-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-update-tools
          include-hidden-files: true
          path: .local/windows-update-tools/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-tooling-diagnostics
          include-hidden-files: true
          path: |
            .local/windows-update-acceptance.json
            .local/windows-update/*/acceptance.json
            .local/windows-update/*/diagnostics/*.log
          if-no-files-found: error
  windows-update:
    name: Windows update acceptance
    needs: windows-tooling
    if: always()
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require successful short tooling proof
        if: needs.windows-tooling.result != 'success'
        run: throw 'Short Windows tooling proof failed; package validation is blocked.'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-update-tools
          path: .local/verified-update-tools
      - run: node scripts/test-windows-update.mjs --tools-dir .local/verified-update-tools
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-update-evidence
          include-hidden-files: true
          path: .local/windows-update-evidence/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-update-receipt
          include-hidden-files: true
          path: |
            .local/windows-update-acceptance.json
            .local/windows-update/*/acceptance.json
            .local/windows-update/*/native-*.png
            .local/windows-update/*/diagnostics/*.log
          if-no-files-found: error
