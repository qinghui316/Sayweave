name: Sayweave Windows validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      phase:
        description: CI only, or explicitly requested update acceptance
        type: choice
        options: [ci, diagnose, startup, full, controller]
        default: ci
      reuse_run:
        description: Same-commit run containing immutable tools/packages (optional)
        type: string
        default: ''
      candidate_sha:
        description: Frozen product SHA for diagnostic or full immutable-package reuse
        type: string
        default: ''
      product_commit:
        description: Frozen verified product for workflow-only controller validation
        type: string
        default: ''
      diagnose_recovery:
        description: Diagnose restart after a real stop timeout using the same signed pair
        type: boolean
        default: false
      diagnose_metadata:
        description: Read raw and TSF API descriptions from the frozen ordinary component
        type: boolean
        default: false
      diagnose_acl:
        description: Compare ACL module loading and exact restoration using the frozen package
        type: boolean
        default: false
      deployment_lifecycle:
        description: Same-package first choice, repeat and owned uninstall acceptance
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
env:
  FROZEN_ACCEPTANCE_PRODUCT: ${{ inputs.phase == 'full' && inputs.candidate_sha || '' }}
concurrency:
  # Preserve installer diagnostics when a corrected candidate is pushed.
  # Only duplicate runs of this exact ref/commit supersede one another.
  group: windows-validation-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  ci:
    name: CI
    needs: windows-tooling
    if: always() && !cancelled() && (github.event_name == 'pull_request' || inputs.phase == 'ci' || inputs.phase == 'full' || needs.windows-tooling.outputs.product_commit != '')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Require successful short tooling proof
        if: github.event_name == 'workflow_dispatch' && inputs.phase != 'ci' && needs.windows-tooling.result != 'success'
        run: throw 'Short Windows tooling proof failed; long validation is blocked.'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check workflow-only controller contracts
        if: needs.windows-tooling.outputs.product_commit != '' || env.FROZEN_ACCEPTANCE_PRODUCT != ''
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Controller type check failed.' }
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw 'Controller lint failed.' }
          npx vitest run tests/release-validation.test.ts tests/windows-update-artifacts.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Controller release contracts failed.' }
      - if: needs.windows-tooling.outputs.product_commit == '' && env.FROZEN_ACCEPTANCE_PRODUCT == ''
        run: npx playwright install chromium
      - name: Check isolated local inference and process contracts
        if: needs.windows-tooling.outputs.product_commit == '' && env.FROZEN_ACCEPTANCE_PRODUCT == ''
        run: node scripts/check-local-asr.mjs
      - if: needs.windows-tooling.outputs.product_commit == '' && env.FROZEN_ACCEPTANCE_PRODUCT == ''
        run: npm run check
      - if: needs.windows-tooling.outputs.product_commit == '' && env.FROZEN_ACCEPTANCE_PRODUCT == ''
        run: npm run test:e2e
      - if: needs.windows-tooling.outputs.product_commit == '' && env.FROZEN_ACCEPTANCE_PRODUCT == ''
        run: npm run test:desktop
      - run: npm run check:distribution
  windows-tooling:
    name: Windows update tooling
    if: github.event_name == 'workflow_dispatch' && inputs.phase != 'diagnose' && inputs.phase != 'ci'
    outputs:
      reuse_run: ${{ steps.reuse.outputs.run_id }}
      product_commit: ${{ steps.scope.outputs.product_commit }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Resolve workflow-only product scope
        id: scope
        env:
          REQUESTED_PRODUCT: ${{ inputs.product_commit }}
          CONTROLLER_PHASE: ${{ inputs.phase }}
          AUTO_CONTROLLER: ${{ github.event_name == 'push' }}
          EXPECTED_CONTROLLER: ${{ github.sha }}
        run: |
          $product = ''
          if ($env:CONTROLLER_PHASE -eq 'controller') {
            if ($env:REQUESTED_PRODUCT -notmatch '^[a-f0-9]{40}$') { throw 'Exact frozen product commit required.' }
            $product = $env:REQUESTED_PRODUCT
          } elseif ($env:AUTO_CONTROLLER -eq 'true') {
            $version = (Get-Content -LiteralPath package.json -Raw -Encoding utf8 | ConvertFrom-Json).version
            $candidate = git rev-parse --verify "refs/tags/v${version}^{commit}" 2>$null
            if ($LASTEXITCODE -eq 0) { $product = ([string]$candidate).Trim() }
          }
          $eligible = $false
          if ($product -match '^[a-f0-9]{40}$' -and $product -ne $env:EXPECTED_CONTROLLER) {
            git merge-base --is-ancestor $product origin/main
            if ($LASTEXITCODE -eq 0) {
              $changes = @(git diff --name-only $product $env:EXPECTED_CONTROLLER)
              if ($LASTEXITCODE -ne 0) { throw 'Product/source comparison failed.' }
              $allowed = @('.github/workflows/windows-release.yml','.github/workflows/windows-ci.yml')
              $eligible = $changes.Count -gt 0 -and @($changes | Where-Object { $_ -notin $allowed }).Count -eq 0
            }
          }
          if ($env:CONTROLLER_PHASE -eq 'controller' -and -not $eligible) { throw 'Controller differs from the frozen product outside the two workflow files.' }
          if (-not $eligible) { $product = '' }
          "product_commit=$product" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          exit 0
      - run: npm ci
      - name: Verify unchanged product and original main evidence
        if: steps.scope.outputs.product_commit != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FROZEN_PRODUCT: ${{ steps.scope.outputs.product_commit }}
          EXPECTED_CONTROLLER: ${{ github.sha }}
        run: |
          $productSource = Join-Path $env:RUNNER_TEMP 'sayweave-frozen-product'
          $evidence = Join-Path $env:GITHUB_WORKSPACE '.local/reused-product-evidence'
          git worktree add --detach $productSource $env:FROZEN_PRODUCT
          if ($LASTEXITCODE -ne 0) { throw 'Frozen product checkout failed.' }
          Push-Location $productSource
          try {
            $env:SAYWEAVE_RELEASE_COMMIT = $env:FROZEN_PRODUCT
            node scripts/reuse-windows-update-evidence.mjs $evidence
            if ($LASTEXITCODE -ne 0) { throw 'Original successful product main evidence invalid.' }
          } finally { Pop-Location }
          node --input-type=module -e "import {readFileSync,writeFileSync} from 'node:fs';import {readMechanismEvidence} from './scripts/windows-update-artifacts.mjs';const e=readMechanismEvidence('.local/reused-product-evidence',process.env.FROZEN_PRODUCT),ci=JSON.parse(readFileSync('.local/reused-product-evidence/ci-run.json','utf8'));writeFileSync('.local/controller-product-binding.json',JSON.stringify({controllerCommit:process.env.EXPECTED_CONTROLLER,productCommit:process.env.FROZEN_PRODUCT,productMainRun:ci.databaseId,productChecks:e.receipt.checks,productComponentSha256:e.tools.manifest.artifacts.component.sha256,productCodeUnchangedExceptWorkflows:true,newProductPackagesBuilt:false},null,2)+'\n')"
          if ($LASTEXITCODE -ne 0) { throw 'Controller/product binding failed.' }
          git worktree remove $productSource
          if ($LASTEXITCODE -ne 0) { throw 'Frozen product checkout cleanup failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.scope.outputs.product_commit != ''
        with:
          name: workflow-product-evidence
          retention-days: 30
          include-hidden-files: true
          path: |
            .local/reused-product-evidence/
            .local/controller-product-binding.json
          if-no-files-found: error
      - name: Resolve same-candidate reuse
        if: steps.scope.outputs.product_commit == ''
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REUSE: ${{ inputs.reuse_run }}
          EXPECTED_COMMIT: ${{ inputs.phase == 'full' && inputs.candidate_sha || github.sha }}
          AUTO_REUSE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          $resolvedReuse = $env:REQUESTED_REUSE
          if ($env:FROZEN_ACCEPTANCE_PRODUCT -and -not $resolvedReuse) { throw 'Frozen full acceptance requires an explicit immutable reuse run; fallback compilation forbidden.' }
          if ($resolvedReuse -and $resolvedReuse -notmatch '^\d+$') { throw 'Invalid reuse run.' }
          if (-not $resolvedReuse -and $env:AUTO_REUSE -eq 'true') {
            $runs = gh run list --repo qinghui316/Sayweave --workflow windows-ci.yml --commit $env:EXPECTED_COMMIT --event workflow_dispatch --status success --limit 20 --json databaseId,headSha | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Reusable run lookup failed.' }
            foreach ($candidate in $runs) {
              if ($candidate.headSha -ne $env:EXPECTED_COMMIT -or ([string]$candidate.databaseId) -notmatch '^\d+$') { throw 'Reusable candidate identity differs.' }
              $assets = gh api "repos/qinghui316/Sayweave/actions/runs/$($candidate.databaseId)/artifacts?per_page=100" | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0 -or $assets.artifacts -isnot [array] -or ($assets.total_count -isnot [int] -and $assets.total_count -isnot [long]) -or $assets.total_count -lt 0 -or $assets.total_count -gt 100 -or @($assets.artifacts).Count -ne $assets.total_count) { throw 'Reusable artifact inventory failed.' }
              $tools = @($assets.artifacts | Where-Object name -eq 'windows-update-tools')
              $packages = @($assets.artifacts | Where-Object name -eq 'windows-update-packages')
              if ($tools.Count -gt 1 -or $packages.Count -gt 1) { throw 'Ambiguous reusable artifact inventory.' }
              if ($tools.Count -eq 1 -and $packages.Count -eq 1 -and $tools[0].expired -eq $false -and $packages[0].expired -eq $false) {
                $resolvedReuse = [string]$candidate.databaseId
                break
              }
            }
          }
          "run_id=$resolvedReuse" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Reuse exact candidate tools
        if: steps.scope.outputs.product_commit == '' && steps.reuse.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ steps.reuse.outputs.run_id }}
          EXPECTED_COMMIT: ${{ inputs.phase == 'full' && inputs.candidate_sha || github.sha }}
        run: |
          if ($env:REUSE_RUN -notmatch '^\d+$') { throw 'Invalid reuse run.' }
          $run = gh api "repos/qinghui316/Sayweave/actions/runs/$env:REUSE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -ne $env:EXPECTED_COMMIT -or $run.path -ne '.github/workflows/windows-ci.yml' -or $run.event -notin @('push','workflow_dispatch','pull_request')) { throw 'Reusable run identity differs.' }
          gh run download $env:REUSE_RUN --name windows-update-tools --dir .local/prior-update-tools
          if ($LASTEXITCODE -ne 0) { throw 'Reusable tools download failed.' }
      - if: steps.scope.outputs.product_commit == ''
        run: |
          if (Test-Path .local/prior-update-tools) { node scripts/test-windows-update.mjs --tools-only --tools-dir .local/prior-update-tools }
          elseif ($env:FROZEN_ACCEPTANCE_PRODUCT) { throw 'Verified frozen tools are missing; fallback compilation forbidden.' }
          else { node scripts/test-windows-update.mjs --tools-only }
          if ($LASTEXITCODE -ne 0) { throw 'Short tooling validation failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.scope.outputs.product_commit == ''
        with:
          name: windows-update-tools
          retention-days: 14
          include-hidden-files: true
          path: .local/windows-update-tools/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.scope.outputs.product_commit == ''
        with:
          name: windows-tooling-diagnostics
          retention-days: 7
          include-hidden-files: true
          path: |
            .local/windows-update-acceptance.json
            .local/windows-update/*/acceptance.json
            .local/windows-update/*/diagnostics/*.log
            .local/windows-update/*/component-target/release/sayweave_text_service.dll
            .local/windows-update/*/probe-target/release/tsf-probe.exe
          if-no-files-found: error
  windows-startup:
    name: Windows installed startup
    needs: windows-tooling
    if: always() && github.event_name == 'workflow_dispatch' && inputs.phase == 'startup'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require successful short tooling proof
        if: needs.windows-tooling.result != 'success'
        run: throw 'Short Windows tooling proof failed; package validation is blocked.'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-update-tools
          path: .local/verified-update-tools
      - name: Reuse exact candidate package
        if: needs.windows-tooling.outputs.reuse_run != ''
        env:
          REUSE_RUN: ${{ needs.windows-tooling.outputs.reuse_run }}
          EXPECTED_COMMIT: ${{ inputs.phase == 'full' && inputs.candidate_sha || github.sha }}
        run: |
          if ($env:REUSE_RUN -notmatch '^\d+$') { throw 'Invalid reuse run.' }
          $run = gh api "repos/qinghui316/Sayweave/actions/runs/$env:REUSE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -ne $env:EXPECTED_COMMIT -or $run.path -ne '.github/workflows/windows-ci.yml' -or $run.event -notin @('push','workflow_dispatch','pull_request')) { throw 'Reusable run identity differs.' }
          $assets = gh api "repos/qinghui316/Sayweave/actions/runs/$env:REUSE_RUN/artifacts?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $assets.artifacts -isnot [array] -or ($assets.total_count -isnot [int] -and $assets.total_count -isnot [long]) -or $assets.total_count -lt 0 -or $assets.total_count -gt 100 -or @($assets.artifacts).Count -ne $assets.total_count) { throw 'Reusable artifact inventory failed.' }
          $packages = @($assets.artifacts | Where-Object name -eq 'windows-update-packages')
          if ($packages.Count -gt 1) { throw 'Ambiguous reusable packages.' }
          if ($packages.Count -eq 1) {
            gh run download $env:REUSE_RUN --name windows-update-packages --dir .local/prior-update-packages
            if ($LASTEXITCODE -ne 0) { throw 'Reusable package download failed.' }
          }
      - run: |
          $arguments = @('--startup-only', '--tools-dir', '.local/verified-update-tools')
          if (Test-Path .local/prior-update-packages) { $arguments += @('--packages-dir', '.local/prior-update-packages') }
          node scripts/test-windows-update.mjs @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Installed startup validation failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-update-packages
          retention-days: 14
          include-hidden-files: true
          path: .local/windows-update-packages/
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-startup-receipt
          retention-days: 30
          include-hidden-files: true
          path: |
            .local/windows-update-acceptance.json
            .local/windows-update/*/acceptance.json
            .local/windows-update/*/diagnostics/*.log
          if-no-files-found: error
  windows-startup-diagnostic:
    name: Same-package installed startup diagnosis
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'diagnose'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Download frozen product package
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.reuse_run }}
          STARTUP_CANDIDATE: ${{ inputs.candidate_sha }}
          DIAGNOSE_METADATA: ${{ inputs.diagnose_metadata }}
        run: |
          if ($env:REUSE_RUN -notmatch '^\d+$' -or $env:STARTUP_CANDIDATE -notmatch '^[a-f0-9]{40}$') { throw 'Exact diagnostic identities required.' }
          $run = gh api "repos/qinghui316/Sayweave/actions/runs/$env:REUSE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -ne $env:STARTUP_CANDIDATE -or $run.path -ne '.github/workflows/windows-ci.yml' -or $run.event -notin @('push','workflow_dispatch','pull_request')) { throw 'Diagnostic package origin differs.' }
          gh run download $env:REUSE_RUN --name windows-update-packages --dir .local/prior-update-packages
          if ($LASTEXITCODE -ne 0) { throw 'Frozen product download failed.' }
          if ($env:DIAGNOSE_METADATA -eq 'true') {
            gh run download $env:REUSE_RUN --name windows-update-tools --dir .local/prior-update-tools
            if ($LASTEXITCODE -ne 0) { throw 'Frozen ordinary tooling download failed.' }
          }
      - name: Short startup with the same signed installer
        env:
          STARTUP_CANDIDATE: ${{ inputs.candidate_sha }}
          DIAGNOSE_RECOVERY: ${{ inputs.diagnose_recovery }}
          DIAGNOSE_METADATA: ${{ inputs.diagnose_metadata }}
          DIAGNOSE_ACL: ${{ inputs.diagnose_acl }}
          DEPLOYMENT_LIFECYCLE: ${{ inputs.deployment_lifecycle }}
        run: |
          $arguments = @()
          if ($env:DIAGNOSE_RECOVERY -eq 'true') { $arguments += '--restart-recovery' }
          if ($env:DIAGNOSE_METADATA -eq 'true') { $arguments += '--metadata' }
          if ($env:DIAGNOSE_ACL -eq 'true') { $arguments += '--acl' }
          if ($env:DEPLOYMENT_LIFECYCLE -eq 'true') { $arguments += '--deployment-lifecycle' }
          node scripts/test-windows-installed-startup.mjs @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Installed startup diagnosis failed; full validation remains blocked.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-startup-diagnostic
          retention-days: 7
          include-hidden-files: true
          path: |
            .local/installed-startup/*/receipt.json
            .local/installed-startup/*/*.log
            .local/installed-startup/*/native-*.png
            .local/update-metadata/*.json
          if-no-files-found: error
  windows-update:
    name: Windows update acceptance
    needs: windows-tooling
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.phase == 'full' || needs.windows-tooling.outputs.product_commit != '')
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require successful short tooling proof
        if: needs.windows-tooling.result != 'success'
        run: throw 'Short Windows tooling proof failed; package validation is blocked.'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Read original product proof for workflow-only changes
        if: needs.windows-tooling.outputs.product_commit != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: workflow-product-evidence
          path: .local/validated-product
      - name: Validate separate controller and product identities
        if: needs.windows-tooling.outputs.product_commit != ''
        env:
          FROZEN_PRODUCT: ${{ needs.windows-tooling.outputs.product_commit }}
          EXPECTED_CONTROLLER: ${{ github.sha }}
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs';import {readMechanismEvidence} from './scripts/windows-update-artifacts.mjs';const b=JSON.parse(readFileSync('.local/validated-product/controller-product-binding.json','utf8')),e=readMechanismEvidence('.local/validated-product/reused-product-evidence',process.env.FROZEN_PRODUCT);if(b.controllerCommit!==process.env.EXPECTED_CONTROLLER||b.productCommit!==process.env.FROZEN_PRODUCT||b.newProductPackagesBuilt!==false||b.productCodeUnchangedExceptWorkflows!==true||!e.receipt.passed)throw Error('Frozen product/controller proof differs');console.log('Verified existing product '+b.productCommit+' for workflow controller '+b.controllerCommit+'; no product package build or new native upgrade claim')"
          if ($LASTEXITCODE -ne 0) { throw 'Frozen product acceptance evidence rejected.' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.windows-tooling.outputs.product_commit == ''
        with:
          name: windows-update-tools
          path: .local/verified-update-tools
      - name: Reuse exact startup package set
        if: needs.windows-tooling.outputs.product_commit == '' && needs.windows-tooling.outputs.reuse_run != ''
        env:
          REUSE_RUN: ${{ needs.windows-tooling.outputs.reuse_run }}
          EXPECTED_COMMIT: ${{ inputs.phase == 'full' && inputs.candidate_sha || github.sha }}
        run: |
          if ($env:REUSE_RUN -notmatch '^\d+$') { throw 'Invalid reuse run.' }
          $run = gh api "repos/qinghui316/Sayweave/actions/runs/$env:REUSE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -ne $env:EXPECTED_COMMIT -or $run.path -ne '.github/workflows/windows-ci.yml' -or $run.event -notin @('push','workflow_dispatch','pull_request')) { throw 'Reusable run identity differs.' }
          $assets = gh api "repos/qinghui316/Sayweave/actions/runs/$env:REUSE_RUN/artifacts?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $assets.artifacts -isnot [array] -or ($assets.total_count -isnot [int] -and $assets.total_count -isnot [long]) -or $assets.total_count -lt 0 -or $assets.total_count -gt 100 -or @($assets.artifacts).Count -ne $assets.total_count) { throw 'Reusable artifact inventory failed.' }
          $packages = @($assets.artifacts | Where-Object name -eq 'windows-update-packages')
          if ($packages.Count -gt 1) { throw 'Ambiguous reusable packages.' }
          if ($packages.Count -eq 1) {
            gh run download $env:REUSE_RUN --name windows-update-packages --dir .local/prior-update-packages
            if ($LASTEXITCODE -ne 0) { throw 'Reusable package set download failed.' }
          }
      - if: needs.windows-tooling.outputs.product_commit == ''
        run: |
          $arguments = @('--tools-dir', '.local/verified-update-tools')
          if (Test-Path .local/prior-update-packages) { $arguments += @('--packages-dir', '.local/prior-update-packages') }
          node scripts/test-windows-update.mjs @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Full upgrade acceptance failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: needs.windows-tooling.outputs.product_commit == ''
        with:
          name: windows-update-evidence
          retention-days: 30
          include-hidden-files: true
          path: .local/windows-update-evidence/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && needs.windows-tooling.outputs.product_commit == ''
        with:
          name: windows-update-packages
          retention-days: 14
          include-hidden-files: true
          path: .local/windows-update-packages/
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && needs.windows-tooling.outputs.product_commit == ''
        with:
          name: windows-update-receipt
          retention-days: 30
          include-hidden-files: true
          path: |
            .local/windows-update-acceptance.json
            .local/windows-update/*/acceptance.json
            .local/windows-update/*/native-*.png
            .local/windows-update/*/diagnostics/*.log
          if-no-files-found: error
