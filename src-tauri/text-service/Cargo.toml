[package]
name = "sayweave-text-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[features]
acceptance = []

[lib]
name = "sayweave_text_service"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tsf-probe"
path = "src/probe.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Memory", "Win32_System_RemoteDesktop", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_TextServices", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

