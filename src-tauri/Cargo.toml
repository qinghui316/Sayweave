[package]
name = "sayweave"
version = "0.1.13"
description = "Sayweave desktop frontend skeleton"
default-run = "sayweave"
edition = "2024"
rust-version = "1.99"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "sayweave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "input-fixture"
path = "src/input_fixture.rs"
required-features = ["desktop-acceptance"]

[[bin]]
name = "input-acceptance"
path = "src/input_acceptance.rs"
required-features = ["desktop-acceptance"]

[[bin]]
name = "desktop-acceptance"
path = "src/desktop_acceptance.rs"
required-features = ["desktop-acceptance"]

[[bin]]
name = "sayweave-installer-helper"
path = "src/bin/installer_helper.rs"

[[bin]]
name = "verify-update-signature"
path = "src/bin/verify_update_signature.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }
serde_json = "1"

[features]
desktop-acceptance = []

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
unicode-normalization = "=0.1.24"
unicode-segmentation = "=1.13.3"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
minisign-verify = "=0.2.5"
base64 = "0.22"
keyring = { version = "=3.6.3", features = ["windows-native"] }
reqwest = { version = "=0.13.5", features = ["json", "stream"] }
tauri-plugin-log = "=2.8.0"
log = "0.4"
cpal = "=0.18.2"
rubato = "=5.0.1"
rtrb = "=0.4.0"
hound = "=3.5.1"
rodio = "=0.22.2"
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
flate2 = "=1.1.10"
tauri-plugin-clipboard-manager = "=2.4.1"
tauri-plugin-opener = "=2.7.0"

[target.'cfg(windows)'.dependencies]
sayweave-text-service = { path = "text-service", default-features = false }
tauri-plugin-global-shortcut = "=2.4.0"
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_Security_Authorization", "Win32_System_Variant", "Win32_Security", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_RemoteDesktop", "Win32_System_Power", "Win32_System_SystemInformation"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
rcgen = "0.14"
# Exercise explicit initialization even when a future dependency enables ring.
rustls = { version = "0.23", features = ["ring"] }

# Retain incremental compilation and line/module diagnostics. Opt into local
# variable/type inspection with CARGO_PROFILE_DEV_DEBUG=2 / TEST_DEBUG=2.
[profile.dev]
debug = 1
incremental = true

[profile.test]
debug = 1
incremental = true





