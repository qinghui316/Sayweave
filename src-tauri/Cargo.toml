[package]
name = "sayweave"
version = "0.1.0"
description = "Sayweave desktop frontend skeleton"
edition = "2024"
rust-version = "1.99"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "sayweave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[features]
desktop-acceptance = []

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
unicode-normalization = "=0.1.24"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
keyring = { version = "=3.6.3", features = ["windows-native"] }
reqwest = { version = "=0.13.5", features = ["json"] }
tauri-plugin-log = "=2.8.0"
log = "0.4"

[dev-dependencies]
tempfile = "3"
rcgen = "0.14"
rustls = "0.23"
