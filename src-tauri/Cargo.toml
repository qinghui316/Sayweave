[package]
name = "sayweave"
version = "0.1.0"
description = "Sayweave desktop frontend skeleton"
default-run = "sayweave"
edition = "2024"
rust-version = "1.99"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "sayweave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "input-fixture"
path = "src/input_fixture.rs"
required-features = ["desktop-acceptance"]

[[bin]]
name = "input-acceptance"
path = "src/input_acceptance.rs"
required-features = ["desktop-acceptance"]

[[bin]]
name = "desktop-acceptance"
path = "src/desktop_acceptance.rs"
required-features = ["desktop-acceptance"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[features]
desktop-acceptance = ["dep:rustls"]

[dependencies]
rustls = { version = "0.23", optional = true }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
unicode-normalization = "=0.1.24"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
keyring = { version = "=3.6.3", features = ["windows-native"] }
reqwest = { version = "=0.13.5", features = ["json"] }
tauri-plugin-log = "=2.8.0"
log = "0.4"
cpal = "=0.18.2"
rubato = "=5.0.1"
rtrb = "=0.4.0"
hound = "=3.5.1"
rodio = "=0.22.2"
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
flate2 = "=1.1.10"
tauri-plugin-clipboard-manager = "=2.4.1"
tauri-plugin-opener = "=2.7.0"

[target.'cfg(windows)'.dependencies]
sayweave-text-service = { path = "text-service", default-features = false }
tauri-plugin-global-shortcut = "=2.4.0"
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Variant", "Win32_Security", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_RemoteDesktop", "Win32_System_Power", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3"
rcgen = "0.14"
rustls = "0.23"
