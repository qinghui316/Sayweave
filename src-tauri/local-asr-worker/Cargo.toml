[package]
name = "sayweave-local-asr-worker"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
default = ["vulkan"]
vulkan = ["transcribe-cpp/vulkan"]
acceptance = ["dep:hound"]

[[bin]]
name = "local-asr-bench"
path = "src/bench.rs"
required-features = ["acceptance"]

[dependencies]
sayweave-local-asr-protocol = { path = "../local-asr-protocol" }
transcribe-cpp = { version = "=0.1.3", default-features = false, features = ["dynamic-backends"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hound = { version = "3.5", optional = true }

[build-dependencies]
sha2 = "0.10"
serde_json = "1"

[profile.dev]
debug = 1

[profile.release]
debug = 0
